<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Display Current Time</title>
    <script>
        function displayTime() {
            var now = new Date(); // 获取当前时间
            var timeString = now.toLocaleTimeString(); // 转换为本地时间字符串
            document.getElementById('time').innerText = timeString; // 显示在页面上
        }

        // 每秒更新时间
        setInterval(displayTime, 1000);
    </script>
</head>
<body>
    <div id="time"></div>
</body>
</html>
